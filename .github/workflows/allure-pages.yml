name: Publish Allure Report

on:
  workflow_run:
    workflows:
      - Multi-Layer Automation CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  ALLURE_VERSION: 2.35.1

jobs:
  publish:
    name: Publish live Allure report
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download Chrome Allure results from CI run
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p allure-results
          gh run download "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --name allure-results-chrome \
            --dir allure-results

      - name: Download latest successful Chrome Allure results
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p allure-results
          RUN_ID="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow tests.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name allure-results-chrome \
            --dir allure-results

      - name: Restore previous Allure history
        run: |
          git fetch origin gh-pages:gh-pages || true
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            rm -rf previous-history
            mkdir -p previous-history
            git archive gh-pages history 2>/dev/null | tar -x || true
            if [ -d history ]; then
              cp -R history/. previous-history/ || true
              rm -rf history
            fi
            mkdir -p allure-results/history
            cp -R previous-history/. allure-results/history/ 2>/dev/null || true
          fi

      - name: Install Allure CLI
        run: |
          curl -fsSL -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      - name: Publish report to gh-pages
        run: |
          touch allure-report/.nojekyll
          rm -rf publish
          mkdir publish
          cp -R allure-report/. publish/

          git checkout --orphan pages-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp -R publish/. .
          rm -rf publish allure-results allure-report previous-history allure.tgz allure-${ALLURE_VERSION}

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: publish Allure report"
          git push --force origin HEAD:gh-pages
